:root{color-scheme:dark;--bg:#0b0907;--ink:#f2e8d5;--card:#16110d;--line:#3a2d1c;--accent:#d4a64a;--mute:#a8987c;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0907;--ink:#f2e8d5;--card:#16110d;--line:#3a2d1c;--accent:#d4a64a;--mute:#a8987c}}
:root[data-theme="dark"]{--bg:#0b0907;--ink:#f2e8d5;--card:#16110d;--line:#3a2d1c;--accent:#d4a64a;--mute:#a8987c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;padding:14px;min-height:100%}
.w{max-width:960px;margin:0 auto}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.lg{width:68px;height:68px;flex:none;border-radius:50%;object-fit:cover;box-shadow:0 0 14px rgba(212,166,74,.35)}
.br{font-family:'Cinzel',serif;font-weight:800;font-size:1.7rem;letter-spacing:.12em;background:linear-gradient(90deg,#f3d58a,#b78a35);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.tg{margin-top:5px;color:var(--mute);font-size:.9rem}
.tg small{display:block;font-family:'Cinzel',serif;letter-spacing:.2em;font-size:.65rem;opacity:.8}
.ft{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:.85rem}
.ft a{color:var(--accent)}
input,select,button{font:inherit;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button{cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:800}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#q{flex:1;min-width:160px}
.tabs button.on{background:var(--accent);color:#1a1206;border-color:var(--accent);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.po{aspect-ratio:2/3;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:800;font-size:1.05rem;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.po{position:relative;overflow:hidden}.po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.po.has span{display:none}
.i{padding:8px 10px;font-size:.85rem;color:var(--mute)}
.st{display:flex;gap:4px;padding:0 8px 8px;flex-wrap:wrap}
.st button{flex:1;padding:5px 6px;font-size:.78rem}
.st button.on{background:var(--accent);border-color:var(--accent);color:#1a1206}
.star{cursor:pointer;color:var(--line);font-size:1.45rem;background:none;border:0;padding:2px 3px;line-height:1}
.star.av{color:#8f6f26}
.star.on{color:#f0b91e}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-family:inherit;max-width:90vw}
#pl{width:min(1100px,98vw);max-width:98vw;padding:8px}
#tmd{width:min(900px,98vw);max-width:98vw;padding:10px}
dialog form{display:flex;flex-direction:column;gap:8px;min-width:240px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.d{padding:0 10px 8px;font-size:.75rem;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rt{color:var(--accent);font-weight:800}

body{padding:0}
.w{max-width:1100px;padding:34px 14px 14px}
.nv{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:10px 4vw;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(11,9,7,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nb{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.lg{width:44px;height:44px}.br{font-size:1.25rem}
.nl{display:flex;gap:20px;font-size:.92rem}.nl a{color:var(--mute);text-decoration:none}.nl a:hover{color:var(--ink)}
.hero{position:relative;min-height:80vh;min-height:80svh;display:grid;place-items:center;text-align:center;padding:70px 6vw;overflow:hidden}
.hb{position:absolute;inset:0;background-size:cover;background-position:center 25%;opacity:0;transition:opacity 1.8s ease}
.hb.on{opacity:1;animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.hs{position:absolute;inset:0;background:linear-gradient(rgba(11,9,7,.15),rgba(11,9,7,.45) 60%,var(--bg))}
.hero{background:radial-gradient(ellipse 60% 45% at 50% 35%,rgba(212,166,74,.32),transparent 70%),radial-gradient(ellipse 90% 40% at 50% 100%,rgba(120,25,20,.5),transparent 70%),#120d08}
.hc{padding:26px 18px;border-radius:18px;background:radial-gradient(ellipse at center,rgba(0,0,0,.38),transparent 72%)}
.hc{position:relative;max-width:700px}
.hc h1{font-family:'Cinzel','Cairo',serif;font-weight:800;font-size:clamp(2.6rem,9vw,5.2rem);line-height:1.1;margin:0 0 16px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.hc p{font-size:1.05rem;color:#e9dfc9;margin:0 0 26px}
.bt{display:inline-block;padding:10px 26px;margin:4px;border-radius:999px;font-weight:800;border:1.5px solid var(--accent);text-decoration:none}
.bt.fl{background:var(--accent);color:#1a1206}.bt.ln{color:var(--accent);background:rgba(0,0,0,.3)}
.hc .tg{margin-top:26px}
.cap{position:absolute;bottom:14px;inset-inline-end:5vw;font-size:.78rem;color:#d9ccb0;opacity:.85}
.ft2{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;margin:50px 0 10px}
.fp{aspect-ratio:4/3;border-radius:8px;background:#1a1510 center/cover;filter:grayscale(1) contrast(1.05)}
.ft2 h2{font-family:'Cinzel','Cairo',serif;color:var(--accent);font-size:1.8rem;margin:0 0 16px}
.fc{background:var(--card);border-radius:8px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.fc h3{margin:0 0 4px;font-size:1rem}.fc p{margin:0;font-size:.88rem;color:var(--mute)}
.m{border-radius:10px;transition:transform .2s,border-color .2s}.m:hover{transform:translateY(-3px);border-color:var(--accent)}
input,select,button{border-radius:999px}
