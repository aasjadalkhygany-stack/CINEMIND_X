<form id="vikiSearch">
  <input id="q" placeholder="ابحث في Viki..." required>
  <button>بحث</button>
</form>

<a href="https://www.viki.com" target="_blank" rel="noopener">شاهد على Viki</a>

<script>
document.getElementById('vikiSearch').onsubmit = e => {
  e.preventDefault();
  const q = encodeURIComponent(document.getElementById('q').value);
  window.open('https://www.viki.com/search?q=' + q, '_blank');
};
</script>
