
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

const raw = (params.get('type') || 'movie').toLowerCase();
const type = ['tv','show','series'].includes(raw) ? 'tv' : 'movie';

let id = params.get('id') || params.get('tmdb_id') ||
         params.get('tmdbId') || params.get('movie_id') ||
         params.get('tv_id');

const titleQ = params.get('title') || params.get('name') || '';
const yearQ = params.get('year') || '';

let key = '14169778c1429a0057cc2e019e83b463';
let lang = 'ar-IQ';

try {
  key = localStorage.getItem('cm-key') || key;
  const savedLang = localStorage.getItem('cm-lang');
  lang = ({
    ar:'ar-IQ', en:'en-US', fr:'fr-FR',
    es:'es-ES', tr:'tr-TR', fa:'fa-IR'
  })[savedLang] || lang;
} catch(e) {}

async function api(path) {
  const url = new URL('https://api.themoviedb.org/3' + path);
  url.searchParams.set('api_key', key);
  url.searchParams.set('language', lang);

  const response = await fetch(url);
  if (!response.ok) throw new Error('TMDB ' + response.status);
  return response.json();
}

const slug = s => (s || '')
  .normalize('NFKD')
  .replace(/[\u0300-\u036f]/g,'')
  .toLowerCase()
  .replace(/[^a-z0-9]+/g,'-')
  .replace(/^-|-$/g,'');

const year = d => (d || '').slice(0,4);

function fail(message) {
  $('loading').classList.add('hidden');
  $('error').textContent = message;
  $('error').classList.remove('hidden');
}

let sourceUrl = '';

$('playerFull').onclick = () => {
  const player = document.querySelector('.player-shell');

  if (document.fullscreenElement) {
    document.exitFullscreen?.();
  } else {
    player.requestFullscreen?.();
  }
};

$('playerOpen').onclick = () => {
  if (sourceUrl) {
    window.open(sourceUrl, '_blank', 'noopener,noreferrer');
  }
};

const frame = $('lookmovieFrame');

frame.addEventListener('load', () => {
  $('frameLoading').classList.add('hidden');
});

function renderEpisode(ep, seasonNumber) {
  $('episodeTitle').textContent =
    `الموسم ${seasonNumber} — الحلقة ${ep.episode_number}: ${ep.name || 'بدون عنوان'}`;

  $('episodeOverview').textContent =
    ep.overview || 'لا يتوفر ملخص لهذه الحلقة.';

  $('episodeDetail').classList.remove('hidden');

  document.querySelectorAll('.episode-btn').forEach(button => {
    button.classList.toggle(
      'active',
      button.dataset.episode === String(ep.episode_number)
    );
  });
}

async function loadSeason(seasonNumber) {
  $('episodes').innerHTML =
    '<div class="state">جاري تحميل الحلقات...</div>';

  $('episodeDetail').classList.add('hidden');

  try {
    const season = await api(`/tv/${id}/season/${seasonNumber}`);
    const episodes = season.episodes || [];

    $('episodesHeading').textContent =
      `حلقات ${season.name || 'الموسم ' + seasonNumber}`;

    $('episodes').innerHTML = '';

    if (!episodes.length) {
      $('episodes').innerHTML =
        '<div class="state">لا توجد حلقات مسجلة لهذا الموسم.</div>';
      return;
    }

    episodes.forEach(ep => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'episode-btn';
      button.dataset.episode = String(ep.episode_number);

      const strong = document.createElement('strong');
      strong.textContent =
        `الحلقة ${ep.episode_number}: ${ep.name || 'بدون عنوان'}`;

      const span = document.createElement('span');
      span.textContent = ep.air_date
        ? `تاريخ العرض: ${ep.air_date}`
        : '';

      button.append(strong, span);
      button.addEventListener('click', () =>
        renderEpisode(ep, seasonNumber)
      );

      $('episodes').appendChild(button);
    });

    renderEpisode(episodes[0], seasonNumber);

  } catch(error) {
    $('episodes').innerHTML =
      '<div class="state">تعذر تحميل حلقات هذا الموسم حالياً.</div>';
  }
}

async function start() {
  try {
    let item;

    if (id && /^\d+$/.test(id)) {
      item = await api(`/${type}/${id}`);
    } else if (titleQ) {
      const search = await api(
        `/search/${type}?query=${encodeURIComponent(titleQ)}`
      );

      item = search.results?.[0];

      if (!item) throw new Error('لم أجد هذا العنوان في TMDB.');

      id = String(item.id);
      item = await api(`/${type}/${id}`);
    } else {
      throw new Error('رابط المشاهدة لا يحتوي رقم الفيلم أو اسمه.');
    }

    const external = await api(`/${type}/${id}/external_ids`);

    const name = item.title || item.name || titleQ || 'عمل سينمائي';
    const original = item.original_title || item.original_name || name;
    const releaseYear = year(item.release_date || item.first_air_date) || yearQ;
    const imdb = (external.imdb_id || '').replace(/^tt/, '');

    $('title').textContent =
      name + (releaseYear ? ` (${releaseYear})` : '');

    $('meta').textContent = [
      releaseYear,
      item.vote_average
        ? '⭐ ' + Number(item.vote_average).toFixed(1) + '/10'
        : '',
      (item.genres || []).map(g => g.name).join(' • '),
      item.runtime ? item.runtime + ' دقيقة' : ''
    ].filter(Boolean).join(' | ');

    $('overview').textContent =
      item.overview || 'لا يتوفر ملخص لهذا العمل حالياً.';

    if (item.poster_path) {
      $('poster').src =
        'https://image.tmdb.org/t/p/w500' + item.poster_path;
    } else {
      $('poster').classList.add('hidden');
    }

    $('loading').classList.add('hidden');
    $('content').classList.remove('hidden');

    if (type === 'tv') {
      $('seriesBox').classList.remove('hidden');

      const seasons = (item.seasons || [])
        .filter(season => season.season_number >= 0);

      $('seasonBar').innerHTML = '';

      if (seasons.length) {
        seasons.forEach((season, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className =
            'season-btn' + (index === 0 ? ' active' : '');

          button.textContent =
            season.name || `الموسم ${season.season_number}`;

          button.onclick = () => {
            document.querySelectorAll('.season-btn')
              .forEach(b => b.classList.remove('active'));

            button.classList.add('active');
            loadSeason(season.season_number);
          };

          $('seasonBar').appendChild(button);
        });

        const requested = Number(params.get('season'));
        const initial = seasons.find(s =>
          s.season_number === requested
        ) || seasons[0];

        const buttons = [...$('seasonBar').children];
        const selected = seasons.indexOf(initial);

        buttons.forEach(b => b.classList.remove('active'));
        if (buttons[selected]) buttons[selected].classList.add('active');

        await loadSeason(initial.season_number);

      } else {
        $('seasonBar').innerHTML =
          '<div class="state">لا توجد مواسم مسجلة لهذا المسلسل.</div>';
      }
    }

    if (imdb) {
      const section = type === 'tv' ? 'shows' : 'movies';

      sourceUrl =
        `https://www.lookmovie2.to/${section}/view/` +
        `${imdb}-${slug(original)}-${releaseYear || ''}`;

      $('frameLoading').classList.remove('hidden');
      frame.src = sourceUrl;

    } else {
      $('frameLoading').innerHTML =
        '<strong>المصدر غير متوفر</strong>لا يوجد رقم IMDb لهذا العمل.';
    }

    document.title = name + ' — CINEMIND_X';

  } catch(error) {
    fail(error.message || 'تعذر تحميل معلومات العمل.');
  }
}

start();
</script>
