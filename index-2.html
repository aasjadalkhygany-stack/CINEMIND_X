<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CINEMIND_X</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0f16;--panel:#151e2b;--card:#263445;--card-on:#c9a84c;--gold:#c9a84c;--text:#f2f4f7;--muted:#a9b4c2;--line:#2b3a4d}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding:14px}
.app{background:var(--panel);border-radius:26px;padding:22px 18px 28px;max-width:560px;margin:auto}
.head{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.logo{width:56px;height:56px;border-radius:16px;background:#1f3047;display:grid;place-items:center;font-size:28px}
.head h1{font-size:26px;color:var(--gold);letter-spacing:1px;font-family:Arial,sans-serif}
.head p{color:var(--muted);font-size:14px;margin-top:2px}
h2{color:var(--gold);font-size:17px;margin:24px 0 12px;font-weight:600}
.series{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:0;border-radius:18px;padding:16px;color:var(--text);font:inherit;cursor:pointer;margin-bottom:10px;text-align:right}
.series b{display:block;font-size:20px;font-family:Arial,sans-serif;text-align:left;direction:ltr}
.series small{color:var(--muted);font-size:14px}
.series .ic{font-size:22px;margin-left:12px}
.series.on{outline:2px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid.eps{grid-template-columns:repeat(3,1fr)}
.btn{background:var(--card);color:var(--text);border:0;border-radius:14px;padding:16px 6px;font:inherit;font-size:16px;cursor:pointer}
.btn.on{background:var(--card-on);color:#1a1405;font-weight:700}
.btn:active{transform:scale(.97)}
.hint{color:var(--muted);font-size:13px;margin-top:22px;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="logo">🎬</div>
    <div><h1>CINEMIND_X</h1><p>مكتبة الأفلام والمسلسلات</p></div>
  </div>

  <h2>📺 اختر المسلسل</h2>
  <div id="series"></div>

  <div id="seasonsBox" class="hidden">
    <h2>📂 المواسم</h2>
    <div id="seasons" class="grid"></div>
  </div>

  <div id="epsBox" class="hidden">
    <h2 id="epsTitle">▶️ الحلقات</h2>
    <div id="eps" class="grid eps"></div>
  </div>

  <p class="hint">اضغط على الحلقة وراح يوصلك الفيديو بالبوت</p>
</div>

<script>
// ===== عدّل البيانات هنا فقط =====
// seasons: { رقم الموسم: عدد الحلقات }
const SERIES = {
  prison_break: { name: "Prison Break", seasons: {1:22, 2:22, 3:13, 4:24, 5:9} },
  // money_heist: { name: "Money Heist", seasons: {1:13, 2:9} },
};
// =================================

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const ARNUM = ["", "الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر"];
let cur = {s:null, se:null};
const $ = id => document.getElementById(id);

function mark(container, el){
  container.querySelectorAll(".on").forEach(x => x.classList.remove("on"));
  el.classList.add("on");
}

function renderSeries(){
  $("series").innerHTML = "";
  for (const key in SERIES){
    const b = document.createElement("button");
    b.className = "series";
    b.innerHTML = `<span class="ic">🎞️</span><span style="flex:1"><small>المواسم والحلقات</small></span><b>${SERIES[key].name}</b>`;
    b.onclick = () => { cur = {s:key, se:null}; mark($("series"), b); renderSeasons(); };
    $("series").appendChild(b);
  }
}

function renderSeasons(){
  const seasons = SERIES[cur.s].seasons;
  $("seasons").innerHTML = "";
  $("epsBox").classList.add("hidden");
  for (const n in seasons){
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = "الموسم " + (ARNUM[n] || n);
    b.onclick = () => { cur.se = n; mark($("seasons"), b); renderEps(); };
    $("seasons").appendChild(b);
  }
  $("seasonsBox").classList.remove("hidden");
}

function renderEps(){
  const count = SERIES[cur.s].seasons[cur.se];
  $("epsTitle").textContent = "▶️ حلقات الموسم " + (ARNUM[cur.se] || cur.se);
  $("eps").innerHTML = "";
  for (let i = 1; i <= count; i++){
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = "الحلقة " + i;
    b.onclick = () => {
      mark($("eps"), b);
      const payload = JSON.stringify({s:cur.s, se:+cur.se, ep:i});
      if (tg) { tg.sendData(payload); } else { alert(payload); }
    };
    $("eps").appendChild(b);
  }
  $("epsBox").classList.remove("hidden");
  $("epsBox").scrollIntoView({behavior:"smooth"});
}

renderSeries();
</script>
</body>
</html>
