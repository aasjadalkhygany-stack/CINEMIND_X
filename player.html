<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<title>CINEMIND_X | المشاهدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090909;--panel:#15120c;--panel2:#1c170d;--line:#3a2f17;--gold:#d6a94a;--gold2:#f0cf7b;--text:#eee8da;--muted:#a89f8a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#211a0d 0%,var(--bg) 52%);color:var(--text);font-family:"Tajawal",Arial,sans-serif;line-height:1.65;min-height:100vh}
header{max-width:1120px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-family:"Cinzel",Georgia,serif;letter-spacing:.13em;color:var(--gold2);text-decoration:none;font-size:1.15rem;direction:ltr;text-shadow:0 0 18px #d6a94a33}
.back{color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:6px 13px;text-decoration:none;font-size:.9rem}
.back:hover{border-color:var(--gold)}
main{max-width:1120px;margin:auto;padding:18px}
.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:4px 0 13px}
h1{font-size:clamp(1.25rem,3vw,1.8rem);color:var(--gold2);margin:0;font-weight:800}
.kicker{font-size:.85rem;color:var(--muted)}
.frame{position:relative;border:1px solid #57431d;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 15px 45px #0009,0 0 0 1px #d6a94a12}
video{width:100%;aspect-ratio:16/9;max-height:72vh;display:block;background:#000;object-fit:contain}
video::cue{font-family:"Tajawal",Arial,sans-serif;font-size:1.25rem;color:#fff;background:#000b}
.controls{background:linear-gradient(180deg,#17130b,#100e09);border:1px solid var(--line);border-top:0;border-radius:0 0 15px 15px;padding:12px}
.progress-line{display:flex;align-items:center;gap:10px;direction:ltr}
input[type=range]{accent-color:var(--gold);cursor:pointer;min-width:0}
#seek{width:100%;height:5px}
.time{font-size:.78rem;color:var(--muted);white-space:nowrap;direction:ltr;font-variant-numeric:tabular-nums}
.control-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,select{background:#17130b;color:var(--text);border:1px solid var(--gold-soft,#a98a45);border-radius:999px;padding:7px 13px;font:inherit;font-size:.88rem;cursor:pointer}
button:hover,select:hover{border-color:var(--gold2);color:var(--gold2)}
button.primary{background:linear-gradient(135deg,#f0cf7b,#b8862f);border:0;color:#171006;font-weight:800;min-width:78px}
button:focus-visible,select:focus-visible,input:focus-visible,.back:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.volume{width:88px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.box{background:linear-gradient(145deg,#19150d,#11100d);border:1px solid var(--line);border-radius:13px;padding:12px}
.box label{display:block;color:var(--gold);font-size:.9rem;margin-bottom:7px}
input[type=file]{width:100%;color:var(--muted);font-family:inherit;font-size:.82rem}
input[type=file]::file-selector-button{background:var(--gold);color:#1a1405;border:0;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;margin-inline-end:7px}
#delay{min-width:55px;text-align:center;color:var(--gold2);direction:ltr;font-weight:700}
.sync{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#msg{color:var(--muted);font-size:.85rem;margin:11px 2px;min-height:1.4em}
footer{max-width:1120px;margin:18px auto 28px;padding:0 18px}
.soc{background:linear-gradient(145deg,#19150d,#11100d);border:1px solid var(--line);border-radius:14px;padding:15px;text-align:center}
.soc p{margin:0 0 8px;color:var(--gold2)}
.soc a{display:inline-block;margin:4px;padding:5px 13px;border:1px solid var(--line);border-radius:9px;color:var(--text);text-decoration:none;font-size:.86rem}
.soc a:hover{border-color:var(--gold);color:var(--gold2)}
.soc small{display:block;margin-top:8px;color:var(--muted);font-size:.75rem}
@media(max-width:560px){header{padding:12px}.logo{font-size:.95rem}main{padding:13px}.controls{padding:9px}.control-row{justify-content:center}.group{justify-content:center}.volume{width:68px}button,select{padding:7px 10px;font-size:.82rem}}
</style>
</head>
<body>
<header>
  <a class="back" href="/">العودة للمكتبة</a>
  <a class="logo" href="/">CINEMIND_X</a>
</header>

<main>
  <div class="heading">
    <h1 id="title">اسم الفيلم</h1>
    <div class="kicker">المشاهدة بجودة تناسبك</div>
  </div>

  <div class="frame">
    <video id="v" playsinline preload="metadata"></video>
  </div>
  <div class="controls">
    <div class="progress-line">
      <span class="time" id="current">00:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="شريط التقدم">
      <span class="time" id="duration">00:00</span>
    </div>
    <div class="control-row">
      <div class="group">
        <button class="primary" id="play" type="button">▶ تشغيل</button>
        <button id="back10" type="button" title="رجوع 10 ثوانٍ">↶ 10</button>
        <button id="forward10" type="button" title="تقديم 10 ثوانٍ">10 ↷</button>
        <button id="mute" type="button">🔊 الصوت</button>
        <input class="volume" id="volume" type="range" min="0" max="1" step=".05" value="1" aria-label="مستوى الصوت">
      </div>
      <div class="group">
        <select id="speed" aria-label="سرعة التشغيل">
          <option value=".75">0.75x</option><option value="1" selected>1x</option>
          <option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
        <button id="fullscreen" type="button">⛶ ملء الشاشة</button>
      </div>
    </div>
  </div>

  <div class="boxes">
    <div class="box">
      <label for="vf">اختيار ملف فيديو من جهازك</label>
      <input id="vf" type="file" accept="video/*">
    </div>
    <div class="box">
      <label for="sf">تحميل الترجمة (SRT أو VTT)</label>
      <input id="sf" type="file" accept=".srt,.vtt,text/vtt">
    </div>
    <div class="box">
      <label>تزامن الترجمة</label>
      <div class="sync">
        <button id="late" type="button" title="أخّر الترجمة">−0.5</button>
        <span id="delay">0.0s</span>
        <button id="early" type="button" title="قدّم الترجمة">+0.5</button>
        <button id="tog" type="button">إخفاء الترجمة</button>
      </div>
    </div>
  </div>
  <div id="msg" role="status">أضف رابط فيديو مباشر عبر src في الرابط، أو اختر ملف فيديو من جهازك.</div>
</main>

<footer>
  <div class="soc">
    <p>يمكنكم متابعة صفحاتنا على مواقع التواصل</p>
    <a href="https://t.me/CINEMIND_X" target="_blank" rel="noopener">Telegram</a>
    <a href="https://www.tiktok.com/@cinemind_x" target="_blank" rel="noopener">TikTok</a>
    <a href="https://www.instagram.com/cinemind_x/" target="_blank" rel="noopener">Instagram</a>
    <a href="https://youtube.com/@cinemind_x" target="_blank" rel="noopener">YouTube</a>
    <small>بالأسود والذهبي… نروي القصة بشكل آخر.</small>
  </div>
</footer>

<script>
/* الاستخدام: player.html?src=رابط-الفيديو&sub=رابط-الترجمة&title=اسم-الفيلم
   src يجب أن يكون رابط ملف فيديو مباشر مدعومًا من المتصفح، وليس رابط صفحة موقع. */
const CONFIG={title:"",videoUrl:"",subtitleUrl:""};
const q=new URLSearchParams(location.search);
const title=q.get("title")||CONFIG.title;
const videoUrl=q.get("src")||CONFIG.videoUrl;
const subUrl=q.get("sub")||CONFIG.subtitleUrl;
const $=id=>document.getElementById(id),v=$("v");
let cues=[],offset=0,track=null,videoObjectUrl=null,subtitleObjectUrl=null,seekDragging=false;

if(title){$("title").textContent=title;document.title=title+" | CINEMIND_X"}

function time(t){
 if(!Number.isFinite(t)||t<0)t=0;
 const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60);
 return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function update(){
 const d=v.duration||0,c=v.currentTime||0;
 $("current").textContent=time(c);$("duration").textContent=time(d);
 if(!seekDragging)$("seek").value=d?Math.round(c/d*1000):0;
 $("play").textContent=v.paused?"▶ تشغيل":"Ⅱ إيقاف";
 $("mute").textContent=v.muted||v.volume===0?"🔇 صامت":"🔊 الصوت";
}
function message(t){$("msg").textContent=t}
$("play").onclick=()=>v.paused?v.play().catch(()=>message("تعذّر تشغيل الفيديو. تحقق من رابط الفيديو أو صيغة الملف.")):v.pause();
$("back10").onclick=()=>v.currentTime=Math.max(0,(v.currentTime||0)-10);
$("forward10").onclick=()=>{if(Number.isFinite(v.duration))v.currentTime=Math.min(v.duration,v.currentTime+10)};
$("mute").onclick=()=>{v.muted=!v.muted;update()};
$("volume").oninput=e=>{v.volume=+e.target.value;v.muted=v.volume===0;update()};
$("speed").onchange=e=>v.playbackRate=+e.target.value;
$("fullscreen").onclick=()=>{const el=$(".frame");if(document.fullscreenElement)document.exitFullscreen?.();else (el.requestFullscreen?.()||v.requestFullscreen?.())};
$("seek").onpointerdown=()=>seekDragging=true;
$("seek").onpointerup=()=>seekDragging=false;
$("seek").oninput=e=>{if(Number.isFinite(v.duration))v.currentTime=(+e.target.value/1000)*v.duration};
["timeupdate","durationchange","loadedmetadata","play","pause","volumechange","ratechange","ended"].forEach(n=>v.addEventListener(n,update));

function toSec(t){
 const m=t.trim().match(/(?:(\d+):)?(\d+):(\d+)[,.](\d+)/);
 if(!m)return null;
 return +(m[1]||0)*3600+(+m[2])*60+(+m[3])+(+m[4].padEnd(3,"0").slice(0,3))/1000;
}
function parseSub(text){
 text=text.replace(/^\uFEFF/,"").replace(/[\u202a-\u202e\u200e\u200f]/g,"").replace(/\r/g,"");
 if(/^WEBVTT/.test(text))text=text.replace(/^WEBVTT[^\n]*\n/,"");
 const out=[];
 for(const block of text.split(/\n\n+/)){
  const lines=block.split("\n").filter(x=>x.trim());
  const i=lines.findIndex(x=>x.includes("-->"));if(i<0)continue;
  const [a,b]=lines[i].split("-->");
  const s=toSec(a),e=toSec(b);if(s===null||e===null)continue;
  const body=lines.slice(i+1).join("\n").replace(/<\/?[^>]+>/g,"");
  if(body)out.push({s,e,body});
 }
 return out;
}
function render(){
 if(!track){track=v.addTextTrack("subtitles","العربية","ar");track.mode="showing"}
 while(track.cues&&track.cues.length)track.removeCue(track.cues[0]);
 for(const c of cues){const cue=new VTTCue(Math.max(0,c.s+offset),Math.max(.05,c.e+offset),c.body);cue.align="center";track.addCue(cue)}
}
async function decode(buf){
 try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}
 catch(_){return new TextDecoder("windows-1256").decode(buf)}
}
async function loadSub(buf){
 cues=parseSub(await decode(buf));offset=0;$("delay").textContent="0.0s";render();
 message(cues.length?"تم تحميل الترجمة بنجاح ("+cues.length+" سطر).":"لم أتمكن من قراءة الترجمة. تأكد أنها SRT أو VTT.");
}
$("vf").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 if(videoObjectUrl)URL.revokeObjectURL(videoObjectUrl);
 videoObjectUrl=URL.createObjectURL(f);v.src=videoObjectUrl;v.load();
 message("تم اختيار الفيديو من جهازك.");
};
$("sf").onchange=async e=>{const f=e.target.files[0];if(f)await loadSub(await f.arrayBuffer())};
$("tog").onclick=()=>{
 if(!track){message("حمّل ملف ترجمة أولاً.");return}
 const on=track.mode==="showing";track.mode=on?"hidden":"showing";
 $("tog").textContent=on?"إظهار الترجمة":"إخفاء الترجمة";
};
function shift(d){offset=Math.round((offset+d)*10)/10;$("delay").textContent=(offset>0?"+":"")+offset.toFixed(1)+"s";render()}
$("early").onclick=()=>shift(-.5);
$("late").onclick=()=>shift(.5);
if(videoUrl){v.src=videoUrl;v.load();message("تم تحميل رابط الفيديو. اضغط تشغيل.");}
if(subUrl){
 fetch(subUrl).then(r=>{if(!r.ok)throw Error("HTTP");return r.arrayBuffer()}).then(loadSub)
 .catch(()=>message("تعذّر تحميل الترجمة من الرابط؛ قد يمنع الموقع الطلبات الخارجية. يمكنك رفع ملف SRT/VTT من جهازك."));
}
window.addEventListener("beforeunload",()=>{if(videoObjectUrl)URL.revokeObjectURL(videoObjectUrl);if(subtitleObjectUrl)URL.revokeObjectURL(subtitleObjectUrl)});
</script>
</body>
</html>
